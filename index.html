<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tafelwerk</title>
<style>
/* Layout: Tafel (frei verschiebbare Widgets) über einer Werkzeugleiste unten, gruppiert nach Zeit / Klasse / Inhalt.
   Keine externen Schriften oder Dienste: alles bleibt auf diesem Gerät. */
:root{
  --ink:#1a2230; --muted:#5a6578; --line:#d7dce6; --card:#ffffff; --card2:#eff2f7; --dock:#fbfcfe;
  --accent:#1f5fd1; --accent-ink:#ffffff; --accent-soft:#e3ebfb;
  --zeit:#1f5fd1; --klasse:#16805a; --inhalt:#bf5512;
  --ok:#1e9a54; --warn:#e0a000; --bad:#d23a3a;
  --shadow:0 12px 32px rgba(18,32,64,.16),0 2px 6px rgba(18,32,64,.08);
  --font:"Atkinson Hyperlegible","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e7ebf3; --muted:#a3adc0; --line:#323b4d; --card:#1b212d; --card2:#252d3b; --dock:#151a23;
  --accent:#6f9cf2; --accent-ink:#0d1422; --accent-soft:#22324f;
  --zeit:#7ea6f4; --klasse:#4cc08d; --inhalt:#f0935a;
  --shadow:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e7ebf3; --muted:#a3adc0; --line:#323b4d; --card:#1b212d; --card2:#252d3b; --dock:#151a23;
  --accent:#6f9cf2; --accent-ink:#0d1422; --accent-soft:#22324f;
  --zeit:#7ea6f4; --klasse:#4cc08d; --inhalt:#f0935a;
  --shadow:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--card2);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ic{width:22px;height:22px;flex:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Grundbausteine */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--card2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.lg{min-height:52px;padding:0 22px;font-size:18px}
.ibtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;flex:none}
.ibtn:hover{background:var(--card2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.field{display:grid;gap:6px}
.field>span{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.inp{min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);width:100%}
textarea.inp{min-height:120px;resize:vertical;line-height:1.5}
.hint{font-size:14px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* App-Gerüst */
#app{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
#board{position:relative;overflow:hidden;background-color:#f6f7f2}
#dock{display:flex;align-items:stretch;gap:12px;padding:8px 12px;background:var(--dock);border-top:1px solid var(--line)}
.dk-side{display:flex;align-items:center;gap:6px;flex:none}
.dk-tools{display:flex;gap:14px;flex:1;justify-content:safe center;min-width:0;overflow-x:auto;scrollbar-width:thin}
.dk-grp{display:grid;gap:2px;justify-items:start}
.dk-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding-left:6px}
.dk-row{display:flex;gap:2px}
.tool{display:grid;justify-items:center;align-content:center;gap:2px;width:54px;min-height:56px;border:0;border-radius:10px;background:transparent;cursor:pointer;padding:4px 2px}
.tool:hover{background:var(--card2)}
.tool .ic{width:24px;height:24px}
.tool span{font-size:10.5px;line-height:1.15;text-align:center;color:var(--muted);max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-zeit{color:var(--zeit)} .cat-klasse{color:var(--klasse)} .cat-inhalt{color:var(--inhalt)}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;max-width:180px}
.pill small{font-weight:400;color:var(--muted)}
.pill .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guest{background:#fff4d6;color:#6b4b00;border-color:#e9cf86}
@media (max-width:1840px){.tool{width:46px}.tool span{display:none}}
@media (max-width:1500px){.pill .lbl,.pill small{display:none}.pill{padding:0 11px}.tool{width:42px}.dk-tools{gap:8px}}
@container (max-height:250px){.tm .chips,.vt .chips{display:none}.tm,.vt{grid-template-rows:1fr auto}}
@container (max-height:330px){.vt .chips{display:none}.vt{grid-template-rows:1fr auto}}
@container (max-height:200px){.laps{display:none}}

/* Aprilscherz */
#app.flip-in{animation:flipIn 1.1s cubic-bezier(.5,-.35,.25,1.25) forwards}
#app.flip-out{animation:flipOut .9s cubic-bezier(.5,-.3,.3,1.2) forwards}
@keyframes flipIn{0%{transform:rotate(0)}12%{transform:rotate(-7deg)}100%{transform:rotate(180deg)}}
@keyframes flipOut{from{transform:rotate(180deg)}to{transform:rotate(360deg)}}
.flip-shield{position:fixed;inset:0;z-index:150000;cursor:pointer}
.apr-host{position:fixed;inset:0;z-index:160000;display:grid;place-items:center;pointer-events:none}
.apr-card{display:grid;justify-items:center;gap:6px;padding:28px 44px;border-radius:24px;background:#eaf7ff;color:#0f2f48;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.apr-card b{font-size:clamp(32px,6vw,72px);line-height:1}
.apr-fish{font-size:clamp(48px,9vw,110px);line-height:1;animation:swim 1.2s ease-in-out infinite alternate}
@keyframes swim{from{transform:translateX(-14px) rotate(-6deg)}to{transform:translateX(14px) rotate(6deg)}}
.apr-card.out{transition:opacity .35s,transform .35s;opacity:0;transform:scale(.85)}

/* Einrasten */
.w.dragging{box-shadow:0 20px 44px rgba(18,32,64,.26),0 2px 6px rgba(18,32,64,.1)}
.w.anim{transition:left .28s ease,top .28s ease,width .28s ease,height .28s ease}
.dk-side .ibtn.on{background:var(--accent-soft);color:var(--accent)}
.dk-div{width:1px;align-self:stretch;margin:8px 4px;background:var(--line)}

/* Widgets */
.w{position:absolute;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.wh{display:flex;align-items:center;gap:2px;padding:2px;min-height:40px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.wh:active{cursor:grabbing}
.wh .t{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .ibtn{width:36px;height:36px;color:var(--muted)}
.wh .ibtn .ic{width:20px;height:20px}
.wb{position:relative;flex:1;min-height:0;container-type:size;overflow:hidden}
.rz{position:absolute;right:0;bottom:0;width:30px;height:30px;cursor:nwse-resize;touch-action:none;z-index:5}
.rz::after{content:"";position:absolute;right:6px;bottom:6px;width:12px;height:12px;border-right:3px solid var(--line);border-bottom:3px solid var(--line);border-radius:0 0 4px 0}
.w.ring{animation:ring 1s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:var(--shadow),0 0 0 0 var(--bad)}50%{box-shadow:var(--shadow),0 0 0 10px color-mix(in srgb,var(--bad) 55%,transparent)}}
.fill{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px;gap:10px}
.center{display:grid;place-items:center;text-align:center}
.empty{position:absolute;inset:0;overflow:hidden;display:grid;place-content:center;justify-items:center;gap:12px;padding:16px;text-align:center;color:var(--muted)}
.cfg{position:absolute;inset:0;z-index:10;background:var(--card);overflow:auto;padding:14px;display:grid;gap:14px;align-content:start}
.cfg .foot{display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:-14px;background:var(--card);padding:10px 0 0}

/* Zeit-Widgets */
.tm{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:8px;padding:8px 12px 12px;align-items:center}
.tm-row{display:flex;align-items:center;justify-content:center;gap:8px;min-height:0}
.tm-disp{font-weight:700;font-size:min(23cqw,36cqh);line-height:1}
.w.low .tm-disp,.w.low .vt-lbl{color:var(--bad)}
.ctl{display:flex;justify-content:center;gap:8px}
.vt{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:8px;padding:8px 12px 12px;justify-items:center;align-items:center}
.vt-dial{position:relative;height:100%;max-height:100%;aspect-ratio:1;max-width:100%;border-radius:50%;background:conic-gradient(var(--bad) calc(var(--p)*1turn),var(--card2) 0);border:4px solid var(--line)}
.vt-dial::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:repeating-conic-gradient(var(--ink) 0 .6deg,transparent .6deg 30deg);-webkit-mask:radial-gradient(circle,transparent 86%,#000 87%);mask:radial-gradient(circle,transparent 86%,#000 87%);opacity:.5}
.vt-lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:min(9cqw,11cqh)}
.vt-lbl b{background:var(--card);padding:2px 10px;border-radius:999px}
.sw{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:8px;padding:8px 12px 12px}
.sw-disp{display:grid;place-items:center;font-weight:700;font-size:min(17cqw,30cqh);line-height:1}
.sw-disp small{font-size:.5em;color:var(--muted)}
.laps{max-height:28cqh;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:14px}
.laps span{background:var(--card2);border-radius:8px;padding:2px 8px}
.clk{position:absolute;inset:0;display:grid;place-items:center;padding:10px}
.clk svg{width:100%;height:100%}
.clk-dig{font-weight:700;font-size:min(22cqw,46cqh);line-height:1}
.clk-dig small{font-size:.45em;color:var(--muted)}
.cal{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
.cal-main{position:relative;z-index:1;display:grid;place-content:center;justify-items:center;text-align:center;padding:10px;gap:2px;min-height:0}
.cal.season{background:var(--s-bg);color:var(--s-fg)}
.cal.season .wd{color:var(--s-acc)}
.cal.season .kw{color:var(--s-fg);opacity:.75}
.cal.season .dn{text-shadow:0 2px 0 rgba(0,0,0,.12)}
.cal-rib{position:relative;z-index:1;padding:6px 10px;background:var(--s-acc);color:var(--s-rfg);font-weight:700;text-align:center;font-size:clamp(11px,min(5.4cqw,9cqh),24px);line-height:1.2;text-wrap:balance}
.cal-ic{position:absolute;z-index:1;right:8px;top:4px;font-size:min(15cqw,20cqh);line-height:1;animation:wig 3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wig{0%,100%{rotate:-6deg}50%{rotate:6deg}}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.deco .p{position:absolute;left:var(--x);top:var(--y);font-size:calc(min(7cqw,10cqh) * var(--s));line-height:1;opacity:.5}
.deco-float .p,.deco-bob .p{opacity:.85}
.cal.season .cal-main{text-shadow:0 0 14px var(--s-glow,transparent),0 0 3px var(--s-glow,transparent)}
.deco-fall .p{top:-12%;animation:fallY var(--d) linear var(--dl) infinite,sway calc(var(--d) / 3) ease-in-out var(--dl) infinite alternate}
@keyframes fallY{from{top:-12%}to{top:108%}}
@keyframes sway{from{translate:calc(var(--sw) * -1) 0;rotate:-25deg}to{translate:var(--sw) 0;rotate:25deg}}
.deco-float .p{animation:drift var(--d) linear var(--dl) infinite}
@keyframes drift{0%{left:-15%;translate:0 0}25%{translate:0 -14px}50%{translate:0 10px}75%{translate:0 -10px}100%{left:110%;translate:0 0}}
.deco-twinkle .p{animation:twk var(--d) ease-in-out var(--dl) infinite}
@keyframes twk{0%,100%{opacity:.15;scale:.6}50%{opacity:1;scale:1.1}}
.deco-bob .p{top:auto;bottom:-2%;translate:-50% 0;animation:bob var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes bob{from{bottom:-4%}to{bottom:4%}}
.cal.season:has(.cal-rib:not([hidden])) .deco-bob .p{bottom:auto;top:58%;animation-name:bob2}
@keyframes bob2{from{translate:-50% 0}to{translate:-50% -10px}}
@media (prefers-reduced-motion:reduce){.deco-fall .p{top:var(--y)}.deco-float .p{left:var(--x)}}
.cal .wd{font-size:min(11cqw,13cqh);font-weight:700;color:var(--zeit)}
.cal .dn{font-size:min(36cqw,44cqh);font-weight:700;line-height:1}
.cal .my{font-size:min(8cqw,10cqh)}
.cal .kw{font-size:min(5.5cqw,8cqh);color:var(--muted);margin-top:4px}
.cd{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:12px;gap:4px}
.cd .ttl{font-size:min(8cqw,11cqh);font-weight:700}
.cd .big{font-size:min(30cqw,40cqh);font-weight:700;line-height:1;color:var(--zeit)}
.cd .unit{font-size:min(8cqw,10cqh)}
.cd .sub{color:var(--muted);font-size:min(5.5cqw,8cqh)}
.tt{position:absolute;inset:0;overflow:auto;padding:10px 12px;display:grid;gap:6px;align-content:start}
.tt-now{padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:min(5.5cqw,22px)}
.tt-now b{display:block;font-size:1.3em}
.tt-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;position:relative;overflow:hidden;font-size:min(4.8cqw,20px)}
.tt-row .tm2{color:var(--muted);font-size:.85em}
.tt-row.past{opacity:.45}
.tt-row.now{background:var(--card2);font-weight:700}
.tt-row .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--zeit)}

/* Klassen-Widgets */
.sl{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:10px 12px 12px}
.sl-meter{position:relative;height:clamp(16px,13cqh,56px);border-radius:999px;background:linear-gradient(90deg,var(--ok) 0 45%,var(--warn) 45% 72%,var(--bad) 72%);opacity:.25}
.sl-wrap{position:relative}
.sl-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--ok),var(--warn) 60%,var(--bad));width:0;transition:width .1s linear}
.sl-thr{position:absolute;top:-6px;bottom:-6px;width:4px;border-radius:2px;background:var(--ink)}
.sl-stat{display:grid;place-items:center;text-align:center;font-weight:700;font-size:min(10cqw,26cqh);text-wrap:balance;cursor:pointer;line-height:1.05;border-radius:12px;min-height:0;overflow:hidden}
.sl-stat.ok{color:var(--ok)} .sl-stat.warn{color:var(--warn)} .sl-stat.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.sl-ctl{display:flex;gap:10px;align-items:center;justify-content:center}
.sl-mid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch;min-height:0}
.sl-count{display:grid;grid-template-columns:auto auto;grid-template-rows:1fr auto;align-items:center;justify-items:center;column-gap:2px;padding:4px 4px 2px 12px;border-radius:12px;background:var(--card2);color:var(--muted);min-width:0}
.sl-count b{grid-row:1;grid-column:1;font-size:clamp(28px,min(16cqw,30cqh),96px);line-height:1;color:var(--ink)}
.sl-count span{grid-row:2;grid-column:1;font-size:13px;font-weight:700;white-space:nowrap}
.sl-count .ibtn{grid-row:1/3;grid-column:2;width:34px;height:34px;align-self:start}
.sl-count.has{background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad)}
.sl-count.has b{color:var(--bad)}
.sl-count.bump b{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@container (max-height:165px){.sl-stat{display:none}.sl-mid{grid-template-columns:1fr;grid-template-rows:auto;align-content:center}}
@container (max-width:260px){.sl-mid{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.sl-count{grid-template-columns:auto auto auto;grid-template-rows:auto;padding:2px 4px 2px 10px;gap:6px;justify-self:center}.sl-count b{font-size:24px}.sl-count span,.sl-count b{grid-row:1;grid-column:auto}.sl-count .ibtn{grid-row:1;grid-column:auto}}
.sl-mini{position:relative;height:30px;border-radius:999px;background:var(--card2);overflow:hidden}
.sl-mini i{position:absolute;inset:0 auto 0 0;width:var(--l,0%);background:linear-gradient(90deg,var(--ok),var(--warn) 60%,var(--bad))}
.sl-mini::after{content:"";position:absolute;top:0;bottom:0;left:var(--t,70%);width:3px;background:var(--ink)}
.sl-mini b{position:relative;display:grid;place-items:center;height:100%;font-size:13px}
.tones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tone{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.tone:hover{background:var(--card2)}
.tone .ic{color:var(--zeit)}
.tl{position:absolute;inset:0;display:grid;place-items:center;padding:10px}
.tl-box{height:100%;aspect-ratio:1/2.6;max-width:100%;min-height:0;background:#20252e;border-radius:28px;padding:8%;display:grid;grid-template-rows:repeat(3,1fr);gap:8%}
.tl-l{border-radius:50%;border:0;cursor:pointer;aspect-ratio:1;height:100%;max-width:100%;justify-self:center;min-height:0;opacity:.18;transition:opacity .2s,box-shadow .2s}
.tl-l.on{opacity:1;box-shadow:0 0 28px currentColor}
.tl-l.r{background:#ff3b30;color:#ff3b30}.tl-l.y{background:#ffc400;color:#ffc400}.tl-l.g{background:#21c45d;color:#21c45d}
.ws{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:8px;padding:10px}
.ws-t{display:grid;place-content:center;justify-items:center;gap:4px;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--card2);cursor:pointer;padding:8px;text-align:center}
.ws-t .e{font-size:min(20cqw,40cqh);line-height:1}
.ws-t .l{font-weight:700;font-size:clamp(12px,5cqw,21px);line-height:1.15}
.rd{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:8px;padding:10px 12px 12px}
.rd-name{display:grid;place-items:center;text-align:center;font-weight:700;font-size:min(13cqw,26cqh);line-height:1.1;overflow-wrap:anywhere}
.rd-name.spin{color:var(--muted)}
.rd-stage{position:relative;min-height:0;display:grid}
.rd-msg{font-size:min(8cqw,18cqh)}
.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:.4}100%{transform:none;opacity:1}}
.rd-reel{position:relative;overflow:hidden;min-height:0;border-radius:12px;background:var(--card2);-webkit-mask:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.rd-strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.rd-item{display:grid;place-items:center;font-weight:700;line-height:1;white-space:nowrap;padding:0 10px;color:var(--muted);transition:color .2s}
.rd-item.win{color:var(--ink)}
.rd-reel.rolling .rd-item{color:var(--ink);filter:blur(.4px)}
.rd-frame{position:absolute;left:6px;right:6px;top:33.333%;height:33.333%;border:3px solid var(--klasse);border-radius:10px;pointer-events:none;box-shadow:0 0 0 999px color-mix(in srgb,var(--card) 8%,transparent)}
.rd-wheel{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden}
.rd-wheel canvas{display:block}
.rd-pointer{position:absolute;left:50%;top:0;width:0;height:0;margin-left:-13px;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));z-index:2}
.rd-banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:92%;padding:8px 18px;border-radius:14px;background:var(--card);color:var(--ink);font-weight:700;font-size:clamp(18px,min(10cqw,14cqh),56px);box-shadow:var(--shadow);text-align:center;overflow-wrap:anywhere;z-index:3}
.rd-banner.pop{animation:popc .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes popc{0%{transform:translate(-50%,-50%) scale(.5)}100%{transform:translate(-50%,-50%)}}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.rd-done{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-height:20cqh;overflow:auto}
.rd-done span{font-size:13px;background:var(--card2);border-radius:6px;padding:1px 7px;text-decoration:line-through;color:var(--muted)}
.gm{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:10px 12px}
.gm-top{display:flex;align-items:center;gap:4px}
.gm-n{font-weight:700;white-space:nowrap}
.gm-go{margin-left:auto}
.gm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;overflow:auto;align-content:start}
.gm-g{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card2)}
.gm-g b{display:block;color:var(--klasse);margin-bottom:4px}
.gm-g div{font-size:min(4.5cqw,19px)}
.sb{position:absolute;inset:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;padding:10px}
.sb-t{display:grid;grid-template-rows:auto 1fr auto;border-radius:12px;padding:8px;color:#fff;text-align:center;min-height:0}
.sb-t .n{font-weight:700;font-size:clamp(12px,calc(13cqw / var(--n,2)),22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-t .s{display:grid;place-items:center;min-height:0;font-weight:700;font-size:min(calc(46cqw / var(--n,2)),40cqh);line-height:1;border:0;background:transparent;color:inherit;cursor:pointer}
.sb-t .b{display:flex;gap:6px;justify-content:center}
.sb-t .b button{flex:1;max-width:44px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.22);color:#fff;cursor:pointer;display:grid;place-items:center}
.pl{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:10px 12px}
.pl-q{font-weight:700;font-size:min(6cqw,26px);text-wrap:balance}
.pl-opts{display:grid;gap:8px;align-content:start;overflow:auto}
.pl-o{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;overflow:hidden;text-align:left;font-size:min(4.6cqw,20px)}
.pl-o i{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);z-index:0;transition:width .3s}
.pl-o span,.pl-o b{position:relative;z-index:1}
.dc{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px;padding:10px}
.dc-row{display:flex;flex-wrap:wrap;gap:4%;justify-content:center;align-content:center;cursor:pointer;border:0;background:transparent}
.die{width:clamp(36px,min(26cqw,52cqh),180px);aspect-ratio:1;border-radius:18%;background:var(--card);border:3px solid var(--ink);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:clamp(6px,3cqmin,18px);margin:6px}
.die i{border-radius:50%;background:var(--ink);width:72%;aspect-ratio:1;place-self:center;visibility:hidden}
.die i.v{visibility:visible}
.die.roll{animation:roll .5s ease-out}
@keyframes roll{0%{transform:rotate(-30deg) scale(.85)}60%{transform:rotate(12deg) scale(1.05)}100%{transform:none}}
.dc-sum{text-align:center;font-weight:700;font-size:min(6cqw,22px)}

/* Kleine Widgets: Zweitrangiges blendet sich aus, statt abgeschnitten zu werden */
@container (max-width:260px){.bl{display:none}.btn.lg{padding:0 14px}}
@container (max-height:240px){.btn.lg{min-height:44px;font-size:16px}}
@container (max-height:250px){.tm .chips{display:none}.tm{grid-template-rows:minmax(0,1fr) auto}}
@container (max-width:230px){.tm-row .ibtn{display:none}}
@container (max-height:90px){.tm .ctl,.sw .ctl,.sl-ctl{display:none}.tm,.sw,.sl{grid-template-rows:minmax(0,1fr)}}
@container (max-height:340px){.vt .chips{display:none}.vt{grid-template-rows:minmax(0,1fr) auto}}
@container (max-height:210px){.laps{display:none}.sw{grid-template-rows:minmax(0,1fr) auto}}

@container (max-width:230px){.ws{grid-template-columns:1fr}.ws-t .e{font-size:min(30cqw,18cqh)}}
@container (max-height:150px){.ws-t .l{display:none}.ws-t .e{font-size:min(20cqw,60cqh)}}
@container (max-height:200px){.rd-done{display:none}.rd{grid-template-rows:minmax(0,1fr) auto}}
@container (max-height:170px){.sb-t .b{display:none}.sb-t{grid-template-rows:auto minmax(0,1fr)}}
@container (max-height:250px){.pl-foot .hint{display:none}}
@container (max-width:300px){.gm-top .ibtn{width:36px}.gm-n{font-size:14px}}
@container (max-height:240px){.empty .hint{display:none}}
@container (max-height:160px){.empty>.ic{display:none}.empty{gap:6px}}
@container (max-height:150px){.dc-sum{display:none}.dc{grid-template-rows:minmax(0,1fr)}}
@container (max-height:230px){.cd .sub,.cal .kw{display:none}}

/* Werkzeugleiste und Widget-Auswahl */
.dk-tools{align-items:center}
.dk-add{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 18px 0 14px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 2px 6px rgba(31,95,209,.3)}
.dk-add .ic{width:24px;height:24px}
.dk-add.on{filter:brightness(.92)}
.dk-favs{display:flex;gap:4px}
.dk-favs .tool{width:72px}
.dk-favs .tool span{display:block!important;max-width:70px;font-size:12px;color:var(--ink)}
.dk-lbtn{width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;border:1px solid var(--line);font-weight:700}
@media (max-width:1500px){.dk-favs .tool{width:58px}.dk-favs .tool span{font-size:10px}}
@media (max-width:1150px){.dk-favs .tool span{display:none!important}.dk-favs .tool{width:46px}.dk-add span{display:none}}
.pick-ov{position:fixed;inset:0;z-index:90000;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px 92px;background:rgba(14,20,32,.25)}
.pick{width:min(1040px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--card);color:var(--ink);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px 18px;display:grid;gap:12px;animation:pickIn .18s ease-out}
@keyframes pickIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.pick-head{display:flex;align-items:center;gap:12px}
.pick-head b{font-size:20px}.pick-head .hint{flex:1}
.pick-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:820px){.pick-cols{grid-template-columns:1fr}}
.pick-col{display:grid;gap:4px;align-content:start}
.pick-col h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.pick-it{display:flex;align-items:center;gap:2px;border-radius:12px}
.pick-it:hover{background:var(--card2)}
.pick-add{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 8px;border:0;border-radius:12px;background:transparent;color:inherit;text-align:left;cursor:pointer}
.pick-ic{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:12px;background:var(--card2)}
.pick-ic .ic{width:24px;height:24px}
.pick-tx{display:grid;min-width:0}
.pick-tx b{font-size:16px}
.pick-tx small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-star{flex:none;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:22px;cursor:pointer}
.pick-star.on{color:#e0a000}
.pick-star:hover{background:var(--card)}

/* Bildschirme */
.dk-scr{width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;border:1px solid var(--line);font-weight:700}
@media (max-width:1500px){.dk-scr-l{display:none}.dk-scr{padding:0 10px}}
.scr{display:grid;gap:18px}
.scr-new{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:center;padding:14px;border-radius:14px;background:var(--card2)}
@media (max-width:640px){.scr-new{grid-template-columns:1fr}}
.scr-new-f{display:grid;gap:6px;min-width:0}
.scr-new-f b{font-size:18px}
.scr-th{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(26,34,48,.12);max-width:100%}
.scr-w{position:absolute;display:grid;place-items:center;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.25);color:#4a5466;overflow:hidden}
.scr-w.dark{color:#e8eef8}.scr-w.ghost{box-shadow:none;outline:1px dashed rgba(26,34,48,.45)}
.scr-w .ic{width:clamp(8px,40%,18px);height:clamp(8px,40%,18px)}
.scr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.scr-card{display:grid;gap:8px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.scr-thb{position:relative;padding:0;border:0;background:none;cursor:pointer;border-radius:10px}
.scr-load{position:absolute;inset:0;display:grid;place-content:center;grid-auto-flow:column;gap:6px;align-items:center;border-radius:10px;background:rgba(14,20,32,.45);color:#fff;font-weight:700;font-size:18px;opacity:0;transition:opacity .15s}
.scr-thb:hover .scr-load,.scr-thb:focus-visible .scr-load{opacity:1}
.scr-info{display:grid;gap:2px;min-width:0}
.scr-name{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scr-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scr-act .btn{min-height:40px;padding:0 12px}
.scr-foot{justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.empty-box{display:grid;gap:6px;justify-items:center;text-align:center;padding:28px 16px;border:2px dashed var(--line);border-radius:14px;color:var(--muted)}
#toast{display:flex;align-items:center;gap:12px}
.toast-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:8px;border:0;background:rgba(255,255,255,.16);color:inherit;font-weight:700;cursor:pointer}
.toast-btn .ic{width:18px;height:18px}

/* Widget-Farbe und Deckkraft */
.wcol-t{background:repeating-conic-gradient(#d7dce6 0 25%,#fff 0 50%) 0 0/12px 12px!important}
.w.w-see{--halo:rgba(255,255,255,.92);color:var(--ink)}
.w.w-see.halo-dark{--halo:rgba(8,12,20,.7)}
.w.w-see .wb{text-shadow:0 0 2px var(--halo),0 0 6px var(--halo),0 0 12px var(--halo)}
.w.w-see .wb :is(button,input,select,textarea,.chip,.btn,.cfg){text-shadow:none}
.w.w-see .wb svg:not(.ic),.w.w-see .wb .ic,.w.w-see .wh .ibtn .ic{filter:drop-shadow(0 0 1.2px var(--halo)) drop-shadow(0 0 4px var(--halo))}
.w.w-see .wb .btn .ic,.w.w-see .wb .chip .ic{filter:none}
.w.w-see .wh{border-bottom-color:transparent}
.w.w-see .wh .ibtn{background:color-mix(in srgb,var(--card) 80%,transparent);margin-left:2px}
.w.w-see .clk .face{fill-opacity:var(--a)}
.w.w-see .cfg{background:var(--card);text-shadow:none}
.w.w-ghost .rz::after{border-color:color-mix(in srgb,var(--ink) 45%,transparent)}
.w.w-ghost.dragging{outline:2px dashed color-mix(in srgb,var(--ink) 40%,transparent);outline-offset:-2px}

.w.wc{color:var(--ink)}
.w.wc .wh .ibtn{color:var(--muted)}
.wcol{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wcol-s{width:38px;height:38px;border-radius:50%;border:2px solid rgba(26,34,48,.18);cursor:pointer}
.wcol-s.on{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--accent)}

/* Text-Widget */
.wh .ibtn.on{background:var(--accent-soft);color:var(--accent)}
.txw{position:absolute;inset:0;display:flex;flex-direction:column;color:var(--ink);--cov:#1a2230}
.txw.bg-note{background:#fff6b0;color:#3a2f00;--cov:#3a2f00}
.txw.bg-board{background:#24533f;color:#f1f6ef;--cov:#f1f6ef}
.txw.bg-clear{background:transparent}
.w.w-clear{background:transparent;box-shadow:none;border-color:transparent}
.w.w-clear .wh{border-bottom-color:transparent;opacity:.35;transition:opacity .2s}
.w.w-clear:hover .wh,.w.w-clear:focus-within .wh{opacity:1}
.tx-view,.tx-edit{line-height:1.25;overflow-wrap:anywhere}
.tx-view{position:relative;flex:1;min-height:0;overflow:hidden;padding:10px 16px;cursor:default;user-select:none;-webkit-user-select:none}
.tx-edit{flex:1;min-height:0;overflow:auto;padding:10px 16px;outline:none;cursor:text;background:transparent}
.tx-edit:focus{box-shadow:inset 0 0 0 2px var(--accent-soft)}
:is(.tx-view,.tx-edit) h1{font-size:1.45em;line-height:1.1;margin:.05em 0 .25em}
:is(.tx-view,.tx-edit) h2{font-size:1.2em;line-height:1.15;margin:.1em 0 .2em}
:is(.tx-view,.tx-edit) p{margin:.12em 0}
:is(.tx-view,.tx-edit) :is(ul,ol){margin:.12em 0;padding-left:1.3em}
:is(.tx-view,.tx-edit) li{margin:.08em 0}
:is(.tx-view,.tx-edit) hr{border:0;border-top:.08em solid currentColor;opacity:.35;margin:.35em 0}
:is(.tx-view,.tx-edit) a{color:inherit;text-decoration:underline}
:is(.tx-view,.tx-edit) blockquote{margin:.12em 0 .12em 1.2em}
:is(.tx-view,.tx-edit) ul.check{list-style:none;padding-left:0}
:is(.tx-view,.tx-edit) ul.check>li{position:relative;padding-left:1.35em}
:is(.tx-view,.tx-edit) ul.check>li::before{content:"";position:absolute;left:.08em;top:.2em;width:.82em;height:.82em;box-sizing:border-box;border:.09em solid currentColor;border-radius:.18em}
:is(.tx-view,.tx-edit) ul.check>li[data-check="1"]::before{background:#16805a;border-color:#16805a}
:is(.tx-view,.tx-edit) ul.check>li[data-check="1"]::after{content:"";position:absolute;left:.36em;top:.3em;width:.24em;height:.48em;border:solid #fff;border-width:0 .09em .09em 0;transform:rotate(45deg)}
:is(.tx-view,.tx-edit) ul.check>li[data-check="1"]{text-decoration:line-through;text-decoration-thickness:.06em}
:is(.tx-view,.tx-edit) ul.check>li[data-check="1"]>*,:is(.tx-view,.tx-edit) ul.check>li[data-check="1"]{color:color-mix(in srgb,currentColor 60%,transparent)}
.tx-view ul.check>li{cursor:pointer}
.tx-view mark.cover{background:var(--cov);color:transparent;border-radius:.18em;padding:0 .12em;cursor:pointer;transition:background .25s,color .25s}
.tx-view mark.cover.open{background:#fff176;color:#1a2230}
.tx-edit mark.cover{background:repeating-linear-gradient(45deg,color-mix(in srgb,currentColor 12%,transparent) 0 6px,color-mix(in srgb,currentColor 22%,transparent) 6px 12px);color:inherit;outline:1px dashed currentColor;border-radius:.15em}
.tx-view li.hid{visibility:hidden}
.tx-steps{position:absolute;right:6px;bottom:6px;z-index:2;display:flex;align-items:center;gap:2px;padding:2px 2px 2px 10px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.1);font-size:13px;font-weight:700}
.tx-steps .ibtn{width:34px;height:34px}
.tx-bar{flex:none;display:flex;align-items:center;gap:2px;padding:3px 4px;border-bottom:1px solid var(--line);background:var(--card);color:var(--ink);overflow:hidden}
.tb-g{flex:none;display:flex;gap:1px;padding-right:3px;margin-right:1px;border-right:1px solid var(--line)}
.tx-bar>.tb-g:last-of-type{border-right:0}
.tb{flex:none;display:grid;place-items:center;width:34px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.tb:hover{background:var(--card2)}
.tb.on,.tb.open{background:var(--accent-soft);color:var(--accent)}
.tb .ic{width:20px;height:20px}
.tx-pop{position:absolute;z-index:30;padding:8px;border-radius:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);max-width:calc(100% - 8px)}
.tx-sw{display:flex;flex-wrap:wrap;gap:6px}
.sw-none{background:linear-gradient(135deg,#fff 44%,#d23a3a 44% 56%,#fff 56%)!important}
.tx-menu{display:grid;gap:2px;min-width:170px}
.tx-mi{min-height:40px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--ink);text-align:left;font-weight:700;cursor:pointer}
.tx-mi:hover{background:var(--card2)}
.mi-h1{font-size:20px}.mi-h2{font-size:17px}
.tx-emo{display:grid;grid-template-columns:repeat(auto-fill,40px);gap:2px;width:min(340px,calc(100cqw - 24px))}
.tx-emo button{height:40px;border:0;border-radius:8px;background:transparent;font-size:22px;cursor:pointer}
.tx-emo button:hover{background:var(--card2)}
.tx-more{display:flex;flex-wrap:wrap;gap:4px;max-width:min(320px,calc(100cqw - 24px))}
.tx-more .tb-g{border-right:0}
.tx-pick .chips{max-width:440px}

/* Inhalt-Widgets */
.tx{position:absolute;inset:0;padding:14px 16px;overflow:auto;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.3}
.tx:empty::before{content:attr(data-ph);color:var(--muted)}
.dr{position:absolute;inset:0;display:flex;flex-direction:column}
.dr-bar{display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--card);overflow-x:auto;flex:none;scrollbar-width:none}
.dr-sep{width:1px;align-self:stretch;margin:4px 4px;background:var(--line);flex:none}
.dr-area{position:relative;flex:1;min-height:0;background:#fff;overflow:hidden}
.dr-cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.sw-c{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;flex:none}
.sw-c.on{box-shadow:0 0 0 3px var(--accent)}
.dr-bar .ibtn{width:38px;height:38px}
.dr-bar .ibtn.on{background:var(--accent-soft);color:var(--accent)}
.dr-bar .btn{min-height:38px;margin-left:auto;flex:none}
.media{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--card2)}
.qr{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;gap:8px;padding:12px}
.qr-box{display:grid;place-items:center;min-height:0;background:#fff;border-radius:10px}
.qr-box svg{width:auto;height:100%;max-width:100%;aspect-ratio:1}
.qr-cap{text-align:center;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.hl{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;padding:14px;text-align:center}
.hl .d{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.hl .btn{font-size:min(6cqw,22px);min-height:56px;max-width:100%}
.hl .btn span{overflow:hidden;text-overflow:ellipsis}
.st{position:absolute;inset:0;display:grid;place-items:center;font-size:min(70cqw,78cqh);line-height:1;user-select:none}
.st-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.st-pick button{font-size:32px;height:56px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.cam video{transform:none}
.cam.mirror video{transform:scaleX(-1)}
.cam-bar{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:2}
.cam-bar .btn{background:rgba(0,0,0,.55);color:#fff;border-color:transparent;min-height:40px}
.note{font-size:13px;color:var(--muted);background:var(--card2);border-radius:8px;padding:8px 10px}

/* Overlays: Profilwahl, Einstellungen, Hintergründe */
.ov{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;padding:16px;background:rgba(14,20,32,.45)}
.modal{width:min(980px,100%);max-height:min(860px,100%);display:grid;grid-template-rows:auto 1fr;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.m-head{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 22px;border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-size:22px;flex:1}
.m-body{overflow:auto;padding:20px 22px;display:grid;gap:18px;align-content:start}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.tab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}
@media (max-width:720px){.split{grid-template-columns:1fr}}
.list{display:grid;gap:6px;align-content:start}
.li{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;font-weight:700}
.li.on{border-color:var(--accent);background:var(--accent-soft)}
.li small{font-weight:400;color:var(--muted);margin-left:auto}
.att{display:flex;flex-wrap:wrap;gap:6px}
.att button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--klasse);background:color-mix(in srgb,var(--klasse) 12%,var(--card));cursor:pointer;font-weight:700}
.att button.off{border-color:var(--line);background:var(--card);color:var(--muted);text-decoration:line-through}
.prose{max-width:68ch;display:grid;gap:10px}
.prose h3{margin:6px 0 0;font-size:18px}
.prose p,.prose ul{margin:0}
.prose li{margin:4px 0}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bg-t{height:96px;border-radius:12px;border:2px solid var(--line);cursor:pointer;display:flex;align-items:flex-end;padding:8px;font-weight:700;font-size:14px;overflow:hidden}
.bg-t span{background:rgba(255,255,255,.88);color:#1a2230;border-radius:6px;padding:1px 7px}
.bg-t.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

#gate{position:fixed;inset:0;z-index:100001;display:grid;place-items:center;padding:16px;overflow:auto;background-color:#f4f6f1;background-image:linear-gradient(#cfd9e8 1px,transparent 1px),linear-gradient(90deg,#cfd9e8 1px,transparent 1px);background-size:28px 28px}
.g-card{width:min(720px,100%);background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:28px;display:grid;gap:20px}
.g-brand{display:flex;align-items:center;gap:14px}
.g-mark{width:52px;height:52px;border-radius:14px;background:#24533f;display:grid;place-items:center;color:#fff}
.g-mark .ic{width:28px;height:28px}
.g-brand h1{margin:0;font-size:30px;letter-spacing:-.01em}
.g-brand p{margin:2px 0 0;color:var(--muted)}
.g-profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.g-p{display:flex;align-items:center;gap:12px;min-height:72px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);cursor:pointer;text-align:left;font-weight:700;font-size:18px}
.g-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.g-p small{display:flex;align-items:center;gap:4px;font-weight:400;font-size:13px;color:var(--muted)}
.g-p small .ic{width:14px;height:14px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pad button{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:26px;font-weight:700;cursor:pointer}
.dots{display:flex;gap:12px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--ink);border-color:var(--ink)}
.dots.err i{border-color:var(--bad)}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:200000;background:var(--ink);color:var(--card);padding:10px 18px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);max-width:min(560px,calc(100% - 32px))}
</style>
</head>
<body>
<div id="app" hidden>
  <main id="board" aria-label="Tafel"></main>
  <nav id="dock" aria-label="Werkzeuge"></nav>
</div>
<div id="gate"></div>
<div id="toast" hidden role="status"></div>

<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {

const AVC=['#1f5fd1','#16805a','#bf5512','#7a3fc4','#0f7f8f','#b5306b'];
function showGate(view){$('#app').hidden=true;const g=$('#gate');g.hidden=false;g.replaceChildren();const card=h('div',{class:'g-card'});g.append(card);
  const brand=h('div',{class:'g-brand'},h('div',{class:'g-mark'},ic('layout-grid')),h('div',null,h('h1',null,'Tafelwerk'),h('p',null,'Timer, Lärmpegel, Gruppen und mehr fürs Whiteboard. Alles bleibt auf diesem Gerät.')));
  if(view==='new'||!APP.profiles.length){const nameIn=h('input',{class:'inp',id:'g-name',placeholder:'z. B. Frau Keller oder 5b Mathe',maxlength:40});const pinIn=h('input',{class:'inp num',id:'g-pin',inputmode:'numeric',maxlength:6,type:'password',placeholder:'optional, 4 bis 6 Ziffern',autocomplete:'new-password'});
    const create=async()=>{const n=nameIn.value.trim();if(!n){nameIn.focus();toast('Bitte einen Profilnamen eingeben.');return}const pin=pinIn.value.trim();if(pin&&!/^\d{4,6}$/.test(pin)){toast('Die PIN braucht 4 bis 6 Ziffern.');return}
      const p={id:uid(),name:n,salt:uid(),pin:null,color:APP.profiles.length%AVC.length};if(pin)p.pin=await hashPin(pin,p.salt);APP.profiles.push(p);saveProfiles();openProfile(p,true)};
    card.append(brand,h('h2',{style:{margin:0,fontSize:'20px'}},APP.profiles.length?'Neues Profil':'Willkommen! Lege dein Profil an.'),h('label',{class:'field'},h('span',null,'Profilname'),nameIn),h('label',{class:'field'},h('span',null,'PIN'),pinIn),
      h('div',{class:'note'},'Ein Profil pro Lehrperson. Darin liegen deine Klassen und gespeicherten Bildschirme. Mit PIN können Kinder es nicht öffnen.'),

    nameIn.addEventListener('keydown',e=>{if(e.key==='Enter')create()});setTimeout(()=>nameIn.focus(),50);return}

function pinPad(p){const g=$('#gate');g.replaceChildren();let v='';const dots=h('div',{class:'dots'});const drawDots=()=>{dots.replaceChildren(...Array.from({length:Math.max(4,v.length)},(_,i)=>h('i',{class:i<v.length?'f':''})))};drawDots();
  const tryIt=async()=>{if(v.length<4){toast('Mindestens 4 Ziffern');return}if(await hashPin(v,p.salt)===p.pin){openProfile(p)}else{v='';dots.classList.add('err');drawDots();toast('Falsche PIN');setTimeout(()=>dots.classList.remove('err'),900)}};
  const press=k=>{if(k==='←')v=v.slice(0,-1);else if(k==='OK')return tryIt();else if(v.length<6)v+=k;drawDots();if(v.length===6)tryIt()};
  const padEl=h('div',{class:'pad'},['1','2','3','4','5','6','7','8','9','←','0','OK'].map(k=>h('button',{onclick:()=>press(k),'aria-label':k==='←'?'Löschen':k==='OK'?'Bestätigen':k},k)));
  const key=e=>{if(!g.contains(padEl)){document.removeEventListener('keydown',key);return}if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('←');else if(e.key==='Enter')press('OK');else if(e.key==='Escape')showGate()};document.addEventListener('keydown',key);
  g.append(h('div',{class:'g-card',style:{width:'min(420px,100%)',justifyItems:'center',textAlign:'center'}},h('span',{class:'g-av',style:{background:AVC[p.color||0],width:'64px',height:'64px',fontSize:'26px'}},p.name.slice(0,1).toUpperCase()),h('h2',{style:{margin:0}},p.name),h('div',{class:'hint'},'PIN eingeben'),dots,padEl,h('button',{class:'btn',onclick:()=>showGate()},ic('arrow-left'),'Anderes Profil')))}

  requestAnimationFrame(()=>{if(starter){starterWidgets(APP.P);save()}APP.P.widgets=APP.P.widgets.filter(r=>WIDGETS[r.type]);APP.P.widgets.forEach(mountWidget)})}
